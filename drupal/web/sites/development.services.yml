# Local development services.
#
# Loaded only from a local settings.local.php:
#   $settings['container_yamls'][] = $app_root . '/sites/development.services.yml';
# Production must not load this file (see default/services.yml).
parameters:
  http.response.debug_cacheability_headers: true
  twig.config: { debug: true, auto_reload: true, cache: false }
services:
  cache.backend.null:
    class: Drupal\Core\Cache\NullBackendFactory
